<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Criterio</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #3b82f6;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px 16px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    h1 {
      font-size: 20px;
      font-weight: 650;
      margin: 0 0 20px 0;
      letter-spacing: -0.3px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .card h2 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px 0;
    }

    .bias {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: #f1f5f9;
      color: #334155;
    }

    .signal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }

    .signal-item:last-child {
      border-bottom: none;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    #status {
      color: var(--muted);
      font-style: italic;
      margin-bottom: 16px;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Criterio</h1>

  <div id="status">Analizando página...</div>

  <div id="source-card" class="card" style="display:none;">
    <h2 id="source-name">—</h2>
    <div style="margin-bottom: 8px;">
      <span class="bias" id="source-bias">—</span>
      <span class="muted"> · </span>
      <span id="source-reliability">—</span>
    </div>
    <p class="muted" id="source-notes" style="margin: 8px 0 0 0;"></p>
  </div>

  <div id="signals-card" class="card" style="display:none;">
    <h2>Señales detectadas</h2>
    <div id="signals-list"></div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
